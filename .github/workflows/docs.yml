name: Documentation

# Builds the DocC site on every pull request; publishes it to GitHub Pages from main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build DocC
    runs-on: ubuntu-24.04
    container: swift:6.4-noble
    env:
      # Makes Package.swift declare swift-docc-plugin, which consumers never resolve.
      CLI_WRAPPERS_DOCS: "1"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install jq
        run: apt-get update && apt-get install -y --no-install-recommends jq
      - name: Cache SwiftPM
        uses: actions/cache@v6.1.0
        with:
          path: .build
          key: docs-spm-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: docs-spm-
      - name: Build DocC site
        run: |
          # Every library product is a documented module; deriving the list keeps it in step
          # with Package.swift instead of a hand-maintained copy.
          targets=$(swift package dump-package \
            | jq -r '.products[] | select(.type | has("library")) | .targets[]' \
            | sed 's/^/--target /' | tr '\n' ' ')
          swift package --allow-writing-to-directory ./docs-output \
            generate-documentation \
            --enable-experimental-combined-documentation \
            $targets \
            --disable-indexing \
            --transform-for-static-hosting \
            --hosting-base-path cli-wrappers \
            --output-path ./docs-output
      - name: Add root redirect to documentation
        run: |
          cat > ./docs-output/index.html <<'HTML'
          <!doctype html>
          <html>
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=documentation/">
              <link rel="canonical" href="documentation/">
              <title>CLI Wrappers Documentation</title>
            </head>
            <body>
              <p>Redirecting to <a href="documentation/">CLI Wrappers documentation</a>…</p>
            </body>
          </html>
          HTML
      - uses: actions/configure-pages@v6.0.0
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: ./docs-output

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
